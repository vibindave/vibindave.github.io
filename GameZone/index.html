<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎬 Guess The Movie Spinner</title>

<style>
  body {
    background: radial-gradient(circle, #1f1c2c, #928dab);
    font-family: "Segoe UI", sans-serif;
    text-align: center;
    color: #fff;
    padding: 20px;
  }

  h1 {
    margin-bottom: 5px;
  }

  .wheel-container {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 30px auto;
  }

  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: conic-gradient(
      #ff9800 0deg 60deg,
      #4caf50 60deg 120deg,
      #03a9f4 120deg 180deg,
      #e91e63 180deg 240deg,
      #9c27b0 240deg 300deg,
      #ffc107 300deg 360deg
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.14, 0.99);
  }

  .pointer {
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 20px solid #fff;
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
  }

  button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: #ffeb3b;
    color: #000;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #fff176;
  }

  .box {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 16px;
    max-width: 650px;
    margin: auto;
  }

  .narration {
    margin-top: 15px;
    font-size: 18px;
    min-height: 70px;
  }

  .reveal {
    font-size: 24px;
    margin-top: 10px;
    color: #00e676;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>🎯 Guess The Movie</h1>
<p>Spin it. Laugh. Guess it. Reveal it.</p>

<div class="wheel-container">
  <div class="pointer"></div>
  <div class="wheel" id="wheel">SPIN</div>
</div>

<div class="box">
  <button onclick="spin()">🎡 Spin</button>
  <button onclick="reveal()">👀 Reveal Movie</button>

  <div class="narration" id="narration"></div>
  <div class="reveal" id="reveal"></div>
</div>

<script>
const movies = [
  { name: "Inception", narration: "People sleep, dream, sleep again, and still need alarms to wake up." },
  { name: "Titanic", narration: "Rich boy, poor girl, one ship, zero lifeboat planning." },
  { name: "Interstellar", narration: "Dad leaves to save Earth, comes back younger than his daughter." },
  { name: "The Matrix", narration: "Office burnout cured by pills and slow-motion kung fu." },
  { name: "Avengers: Endgame", narration: "Grown adults time-travel to fix mistakes using bracelets." },
  { name: "Jaws", narration: "Shark hates tourists and the feeling is mutual." },
  { name: "Jurassic Park", narration: "Scientists say ‘oops’ and dinosaurs say ‘snack time’." },
  { name: "Forrest Gump", narration: "Man runs accidentally through American history." },
  { name: "The Dark Knight", narration: "Serious man fights a clown with commitment issues." },
  { name: "Gladiator", narration: "Office politics but with swords." },

  { name: "Avatar", narration: "Blue people fight humans over real estate." },
  { name: "The Lion King", narration: "Uncle murders dad, blames kid, waits for retirement." },
  { name: "Harry Potter", narration: "School where teachers try to kill students yearly." },
  { name: "Frozen", narration: "Sister freezes everything except her emotions." },
  { name: "Sholay", narration: "Village hires two freelancers for lifetime trauma." },
  { name: "Bahubali", narration: "Everyone asks one question, nobody answers quickly." },
  { name: "3 Idiots", narration: "Engineering students survive pressure with friendship." },
  { name: "KGF", narration: "Man whispers aggressively and everyone obeys." },
  { name: "Pushpa", narration: "Smuggling but with style and shoulder confidence." },
  { name: "RRR", narration: "Two friends casually overthrow an empire." },

  { name: "Toy Story", narration: "Toys panic whenever new HR joins." },
  { name: "Up", narration: "Old man solves grief using balloons." },
  { name: "Finding Nemo", narration: "Overprotective dad ignores GPS advice." },
  { name: "Pirates of the Caribbean", narration: "Drunk captain succeeds accidentally." },
  { name: "Iron Man", narration: "Rich guy solves problems by upgrading hardware." },
  { name: "Doctor Strange", narration: "Surgeon loses hands, gains Wi-Fi magic." },
  { name: "Spider-Man", narration: "Teen ignores homework to save city." },
  { name: "Kung Fu Panda", narration: "Food-loving panda becomes fitness inspiration." },
  { name: "Rocky", narration: "Man runs upstairs and wins hearts." },
  { name: "The Social Network", narration: "Friends break up over a website." }
];

let angle = 0;
let currentMovie = null;

function spin() {
  const spins = Math.floor(Math.random() * 5) + 5;
  angle += spins * 360;
  document.getElementById("wheel").style.transform = `rotate(${angle}deg)`;

  const pick = Math.floor(Math.random() * movies.length);
  currentMovie = movies[pick];

  document.getElementById("narration").innerText =
    "🎤 Narration:\n" + currentMovie.narration;

  document.getElementById("reveal").innerText = "";
}

function reveal() {
  if (!currentMovie) return;
  document.getElementById("reveal").innerText =
    "🎬 Movie: " + currentMovie.name;
}
</script>

</body>
</html>
