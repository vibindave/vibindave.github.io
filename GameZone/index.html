<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎬 Guess The Movie Spinner</title>

<style>
  body {
    background: radial-gradient(circle, #1f1c2c, #928dab);
    font-family: "Segoe UI", sans-serif;
    text-align: center;
    color: #fff;
    padding: 20px;
  }

  .wheel-container {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 30px auto;
  }

  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: conic-gradient(
      #ff9800 0deg 60deg,
      #4caf50 60deg 120deg,
      #03a9f4 120deg 180deg,
      #e91e63 180deg 240deg,
      #9c27b0 240deg 300deg,
      #ffc107 300deg 360deg
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.14, 0.99);
  }

  .pointer {
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 20px solid #fff;
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
  }

  button {
    padding: 12px 18px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    background: #ffeb3b;
    color: #000;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }

  .box {
    background: rgba(0,0,0,0.35);
    padding: 22px;
    border-radius: 16px;
    max-width: 720px;
    margin: auto;
  }

  .narration, .twister {
    margin-top: 15px;
    font-size: 18px;
    min-height: 60px;
  }

  .reveal {
    font-size: 24px;
    margin-top: 10px;
    color: #00e676;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>🎯 Guess The Movie</h1>
<p>Spin it. Laugh. Guess it. Reveal it.</p>

<div class="wheel-container">
  <div class="pointer"></div>
  <div class="wheel" id="wheel">SPIN</div>
</div>

<div class="box">
  <button onclick="spin()">🎡 Spin</button>
  <button onclick="reveal()">👀 Reveal Movie</button>
  <button onclick="pickTwister()">👅 Tongue Twister</button>

  <div class="narration" id="narration"></div>
  <div class="reveal" id="reveal"></div>
  <div class="twister" id="twister"></div>
</div>

<script>
/* ================= DATA ================= */

const movies = [
  { name: "Inception", narration: "People sleep, dream, sleep again, and still feel tired." },
  { name: "Titanic", narration: "Love story where safety rules take a holiday." },
  { name: "Interstellar", narration: "Dad travels space to win worst time-management award." },
  { name: "The Matrix", narration: "Office burnout cured by pills and flying kicks." },
  { name: "Avengers: Endgame", narration: "Adults undo mistakes using time travel and hope." },
  { name: "Jaws", narration: "Shark with personal issues vs beach economy." },
  { name: "Jurassic Park", narration: "Dinosaurs prove why manuals exist." },
  { name: "Forrest Gump", narration: "Man jogs through history accidentally." },
  { name: "The Dark Knight", narration: "Serious man debates ethics with a clown." },
  { name: "Gladiator", narration: "Office politics, ancient edition." },

  { name: "Avatar", narration: "Blue people defend their forest aggressively." },
  { name: "The Lion King", narration: "Family drama with singing wildlife." },
  { name: "Harry Potter", narration: "School where exams are least dangerous thing." },
  { name: "Frozen", narration: "Emotional issues cause weather problems." },
  { name: "Sholay", narration: "Village outsources crime control." },
  { name: "Bahubali", narration: "Long backstory before simple answer." },
  { name: "3 Idiots", narration: "Friends survive education system together." },
  { name: "KGF", narration: "Man whispers, world listens." },
  { name: "Pushpa", narration: "Confidence does the heavy lifting." },
  { name: "RRR", narration: "Friendship casually defeats empire." },

  { name: "Toy Story", narration: "Toys fear replacement like employees." },
  { name: "Up", narration: "Retirement plan involves balloons." },
  { name: "Finding Nemo", narration: "Dad ignores maps repeatedly." },
  { name: "Pirates of the Caribbean", narration: "Drunk captain succeeds anyway." },
  { name: "Iron Man", narration: "Rich guy solves problems with upgrades." },
  { name: "Doctor Strange", narration: "Surgeon switches career via magic." },
  { name: "Spider-Man", narration: "Teen balances homework and hero work." },
  { name: "Kung Fu Panda", narration: "Snack-loving panda becomes legend." },
  { name: "Rocky", narration: "Man runs upstairs, never stops." },
  { name: "The Social Network", narration: "Friendship ends over a website." }
];

const tongueTwisters = [
  "She sells seashells by the seashore",
  "Red lorry yellow lorry",
  "Peter Piper picked a peck of pickled peppers",
  "Betty bought butter but the butter was bitter",
  "Unique New York",
  "Toy boat toy boat toy boat",
  "Irish wristwatch",
  "Rubber baby buggy bumpers",
  "Greek grapes Greek grapes",
  "Six slippery snails slid slowly seaward",
  "Fuzzy Wuzzy was a bear",
  "Fresh fried fish",
  "Black bug bled black blood",
  "Eleven benevolent elephants",
  "Thin sticks thick bricks",
  "She sees cheese",
  "Near an ear a nearer ear",
  "Busy buzzing bumblebees",
  "Tom threw Tim three thumbtacks",
  "Good blood bad blood",
  "Truly rural",
  "He threw three free throws",
  "Four furious friends fought for food",
  "Crisp crusts crackle crunchily",
  "Scissors sizzle thistles sizzle",
  "How much wood would a woodchuck chuck",
  "Six sleek swans swam swiftly southward",
  "Can you can a can as a canner can",
  "Lesser leather never weathered wetter weather",
  "I scream you scream we all scream for ice cream"
];

/* ================= NO REPEAT LOGIC ================= */

let unusedMovies = [...movies];
let unusedTwisters = [...tongueTwisters];
let angle = 0;
let currentMovie = null;

function getRandomItem(arr) {
  const index = Math.floor(Math.random() * arr.length);
  return arr.splice(index, 1)[0];
}

function spin() {
  if (unusedMovies.length === 0) {
    unusedMovies = [...movies]; // reset when exhausted
  }

  angle += (Math.floor(Math.random() * 5) + 5) * 360;
  document.getElementById("wheel").style.transform = `rotate(${angle}deg)`;

  currentMovie = getRandomItem(unusedMovies);

  document.getElementById("narration").innerText =
    "🎤 Narration:\n" + currentMovie.narration;
  document.getElementById("reveal").innerText = "";
}

function reveal() {
  if (!currentMovie) return;
  document.getElementById("reveal").innerText =
    "🎬 Movie: " + currentMovie.name;
}

function pickTwister() {
  if (unusedTwisters.length === 0) {
    unusedTwisters = [...tongueTwisters]; // reset when exhausted
  }

  const twister = getRandomItem(unusedTwisters);
  document.getElementById("twister").innerText =
    "👅 Tongue Twister:\n" + twister;
}
</script>

</body>
</html>
