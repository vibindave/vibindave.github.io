<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sudoku Master</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container {
  background:#fff;
  padding:30px;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
  width:100%;
  max-width:1100px;
}

h1 {
  text-align:center;
  margin-bottom:20px;
  color:#667eea;
}

/* -------- GRID FIXED PERFECTLY -------- */

.board-wrapper {
  display:flex;
  justify-content:center;
  margin-bottom:25px;
}

.sudoku-grid {
  display:grid;
  grid-template-columns: repeat(9, 50px);
  grid-template-rows: repeat(9, 50px);
  border:4px solid #000;
}

.cell {
  border:1px solid #999;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
}

.cell input {
  width:100%;
  height:100%;
  border:none;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  outline:none;
}

.cell.given {
  background:#f0f0f0;
}

.cell.selected {
  background:#fff3b0;
}

.cell.related {
  background:#e3f2fd;
}

.cell.conflict {
  background:#ffcdd2;
}

/* 3x3 thick borders */
.cell:nth-child(3n) { border-right:3px solid #000; }
.cell:nth-child(9n) { border-right:none; }

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom:3px solid #000;
}

/* Controls */

.controls {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

button {
  padding:12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  background:#667eea;
  color:white;
  transition:.2s;
}

button:hover { transform:translateY(-3px); }

.stats {
  text-align:center;
  margin-bottom:15px;
}

.timer {
  font-family:monospace;
  font-size:18px;
  color:#764ba2;
}

@media(max-width:768px){
  .sudoku-grid {
    grid-template-columns:repeat(9,40px);
    grid-template-rows:repeat(9,40px);
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>🎮 Sudoku Master</h1>

  <div class="stats">
    ⏱ Time: <span id="timer" class="timer">00:00</span> |
    Filled: <span id="filled">0</span>/81
  </div>

  <div class="board-wrapper">
    <div class="sudoku-grid" id="grid"></div>
  </div>

  <div class="controls">
    <button onclick="newGame('easy')">Easy</button>
    <button onclick="newGame('medium')">Medium</button>
    <button onclick="newGame('hard')">Hard</button>
    <button onclick="checkSolution()">Check</button>
    <button onclick="clearBoard()">Clear</button>
    <button onclick="reveal()">Reveal</button>
  </div>
</div>

<script>
let board = [];
let solution = [];
let timerInt;
let seconds = 0;

const difficultyLevels = {
  easy: 30,
  medium: 40,
  hard: 55
};

class Sudoku {
  constructor(){
    this.reset();
  }

  reset(){
    this.board = Array(9).fill().map(()=>Array(9).fill(0));
  }

  generate(difficulty){
    this.reset();
    this.fillBoard();
    solution = this.board.map(r=>[...r]);

    let remove = difficultyLevels[difficulty];
    while(remove>0){
      let r=Math.floor(Math.random()*9);
      let c=Math.floor(Math.random()*9);
      if(this.board[r][c]!==0){
        this.board[r][c]=0;
        remove--;
      }
    }
    board=this.board.map(r=>[...r]);
  }

  fillBoard(){
    for(let r=0;r<9;r++){
      for(let c=0;c<9;c++){
        if(this.board[r][c]===0){
          let nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5);
          for(let n of nums){
            if(this.valid(r,c,n)){
              this.board[r][c]=n;
              if(this.fillBoard()) return true;
              this.board[r][c]=0;
            }
          }
          return false;
        }
      }
    }
    return true;
  }

  valid(r,c,n){
    for(let i=0;i<9;i++){
      if(this.board[r][i]===n) return false;
      if(this.board[i][c]===n) return false;
    }
    let br=Math.floor(r/3)*3;
    let bc=Math.floor(c/3)*3;
    for(let i=0;i<3;i++)
      for(let j=0;j<3;j++)
        if(this.board[br+i][bc+j]===n) return false;
    return true;
  }
}

function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      const cell=document.createElement("div");
      cell.className="cell";
      if(board[r][c]!==0) cell.classList.add("given");

      const input=document.createElement("input");
      input.maxLength=1;
      input.value=board[r][c]||"";
      if(board[r][c]!==0) input.disabled=true;

      input.addEventListener("input",(e)=>{
        let val=e.target.value.replace(/[^1-9]/g,'');
        e.target.value=val;
        board[r][c]=val?parseInt(val):0;
        updateStats();
        checkConflicts();
      });

      input.addEventListener("focus",()=>{
        document.querySelectorAll(".cell").forEach(c=>c.classList.remove("selected","related"));
        cell.classList.add("selected");
        highlight(r,c);
      });

      input.addEventListener("keydown",(e)=>{
        if(e.key==="ArrowRight") move(r,c+1);
        if(e.key==="ArrowLeft") move(r,c-1);
        if(e.key==="ArrowDown") move(r+1,c);
        if(e.key==="ArrowUp") move(r-1,c);
      });

      cell.appendChild(input);
      grid.appendChild(cell);
    }
  }
  updateStats();
}

function move(r,c){
  if(r>=0&&r<9&&c>=0&&c<9){
    document.querySelectorAll("input")[r*9+c].focus();
  }
}

function highlight(r,c){
  document.querySelectorAll(".cell").forEach((cell,i)=>{
    let rr=Math.floor(i/9);
    let cc=i%9;
    if(rr===r||cc===c||
      (Math.floor(rr/3)===Math.floor(r/3)&&
       Math.floor(cc/3)===Math.floor(c/3))){
        cell.classList.add("related");
    }
  });
}

function checkConflicts(){
  const inputs=document.querySelectorAll("input");
  inputs.forEach(i=>i.parentElement.classList.remove("conflict"));
  inputs.forEach((i,idx)=>{
    let r=Math.floor(idx/9);
    let c=idx%9;
    let val=i.value;
    if(!val) return;
    inputs.forEach((j,jdx)=>{
      if(idx===jdx) return;
      let rr=Math.floor(jdx/9);
      let cc=jdx%9;
      if(j.value===val &&
         (rr===r||cc===c||
          (Math.floor(rr/3)===Math.floor(r/3)&&
           Math.floor(cc/3)===Math.floor(c/3)))){
        i.parentElement.classList.add("conflict");
        j.parentElement.classList.add("conflict");
      }
    });
  });
}

function updateStats(){
  let filled=board.flat().filter(v=>v!==0).length;
  document.getElementById("filled").textContent=filled;
}

function startTimer(){
  clearInterval(timerInt);
  seconds=0;
  timerInt=setInterval(()=>{
    seconds++;
    let m=Math.floor(seconds/60);
    let s=seconds%60;
    document.getElementById("timer").textContent=
      `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
}

function checkSolution(){
  if(board.flat().some(v=>v===0)) return alert("Fill all cells!");
  if(board.flat().every((v,i)=>v===solution.flat()[i])){
    clearInterval(timerInt);
    alert("🎉 You solved it!");
  } else {
    alert("❌ Incorrect solution!");
  }
}

function clearBoard(){
  document.querySelectorAll("input:not(:disabled)").forEach(i=>{
    i.value="";
  });
  board=board.map((r,ri)=>r.map((v,ci)=>solution[ri][ci]===v?0:v));
  updateStats();
}

function reveal(){
  document.querySelectorAll("input").forEach((i,idx)=>{
    let r=Math.floor(idx/9);
    let c=idx%9;
    i.value=solution[r][c];
    i.disabled=true;
  });
  clearInterval(timerInt);
}

function newGame(level){
  const game=new Sudoku();
  game.generate(level);
  render();
  startTimer();
}

newGame("easy");
</script>
</body>
</html>
